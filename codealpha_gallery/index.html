<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>📸 My Image Gallery</h1>
        <p>Click on any image to view it in full size</p>
    </header>

    <!-- Filter Buttons -->
    <div class="filter-container">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery">
        <!-- Nature Images -->
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/seed/nature1/400/300" alt="Nature 1">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/seed/nature2/400/300" alt="Nature 2">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/seed/nature3/400/300" alt="Nature 3">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>

        <!-- City Images -->
        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/seed/city1/400/300" alt="City 1">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>
        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/seed/city2/400/300" alt="City 2">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>
        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/seed/city3/400/300" alt="City 3">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>

        <!-- Animals Images -->
        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/seed/animals1/400/300" alt="Animals 1">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/seed/animals2/400/300" alt="Animals 2">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/seed/animals3/400/300" alt="Animals 3">
            <div class="overlay">
                <span>View Image</span>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="closeBtn">&times;</button>
        <button class="lightbox-nav prev" id="prevBtn">&#10094; Prev</button>
        <button class="lightbox-nav next" id="nextBtn">Next &#10095;</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="Full size image">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
